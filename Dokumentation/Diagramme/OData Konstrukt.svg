
<svg width="100%" viewBox="0 0 680 620">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── ROOT: ODataModel ── -->
  <g class="node c-purple" onclick="sendPrompt('Was ist das ODataModel in UI5 OData V4?')">
    <rect x="240" y="20" width="200" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">ODataModel</text>
    <text class="ts" x="340" y="58" text-anchor="middle" dominant-baseline="central">this.getView().getModel()</text>
  </g>

  <!-- Linie: Model → Request Context -->
  <line x1="340" y1="72" x2="340" y2="110" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
  <text class="ts" x="350" y="96" fill="var(--color-text-secondary)">bindElement()</text>

  <!-- ── Request Context (View-Ebene) ── -->
  <g class="node c-teal" onclick="sendPrompt('Wie funktioniert bindElement für einen Request in UI5 OData V4?')">
    <rect x="190" y="110" width="300" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="130" text-anchor="middle" dominant-baseline="central">Request Context</text>
    <text class="ts" x="340" y="150" text-anchor="middle" dominant-baseline="central">/Requests(RequestID=...,IsActiveEntity=false)</text>
  </g>

  <!-- Code-Box: this.oRequestContext -->
  <rect x="490" y="118" width="170" height="44" rx="6" fill="none" stroke="var(--color-border-secondary)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="ts" x="575" y="136" text-anchor="middle" dominant-baseline="central" fill="var(--color-text-secondary)">this.getView()</text>
  <text class="ts" x="575" y="152" text-anchor="middle" dominant-baseline="central" fill="var(--color-text-secondary)">.getBindingContext()</text>

  <!-- Verbindungslinie zur Code-Box -->
  <line x1="490" y1="140" x2="492" y2="140" stroke="var(--color-border-secondary)" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- Felder direkt am Request -->
  <rect x="20" y="118" width="155" height="44" rx="6" fill="none" stroke="var(--color-border-secondary)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="ts" x="97" y="136" text-anchor="middle" dominant-baseline="central" fill="var(--color-text-secondary)">{RequestID}</text>
  <text class="ts" x="97" y="152" text-anchor="middle" dominant-baseline="central" fill="var(--color-text-secondary)">{Betreff} {RequestDescription}</text>
  <line x1="175" y1="140" x2="190" y2="140" stroke="var(--color-border-secondary)" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- Linie: Request → _Offer -->
  <line x1="280" y1="170" x2="200" y2="240" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
  <text class="ts" x="200" y="210" text-anchor="middle" fill="var(--color-text-secondary)">bindList("_Offer")</text>

  <!-- Linie: Request → _Participant -->
  <line x1="400" y1="170" x2="500" y2="240" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
  <text class="ts" x="490" y="210" text-anchor="middle" fill="var(--color-text-secondary)">bindList("_Participant")</text>

  <!-- ── _Offer Context ── -->
  <g class="node c-amber" onclick="sendPrompt('Wie erstelle ich einen Offer Context in UI5 OData V4?')">
    <rect x="80" y="240" width="230" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="195" y="260" text-anchor="middle" dominant-baseline="central">Offer Context</text>
    <text class="ts" x="195" y="278" text-anchor="middle" dominant-baseline="central">this.oOfferContext = binding.create({})</text>
  </g>

  <!-- ── _Participant Context ── -->
  <g class="node c-coral" onclick="sendPrompt('Wie erstelle ich einen Participant Context in UI5 OData V4?')">
    <rect x="390" y="240" width="230" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="505" y="260" text-anchor="middle" dominant-baseline="central">Participant Context</text>
    <text class="ts" x="505" y="278" text-anchor="middle" dominant-baseline="central">this.oParticipantContext = binding.create({})</text>
  </g>

  <!-- Linie: Offer → _Position -->
  <line x1="195" y1="300" x2="195" y2="370" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
  <text class="ts" x="245" y="340" text-anchor="middle" fill="var(--color-text-secondary)">bindList("_Position")</text>

  <!-- ── _Position Context ── -->
  <g class="node c-blue" onclick="sendPrompt('Wie erstelle ich einen Position Context ausgehend vom Offer Context in UI5 OData V4?')">
    <rect x="80" y="370" width="230" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="195" y="390" text-anchor="middle" dominant-baseline="central">Position Context</text>
    <text class="ts" x="195" y="408" text-anchor="middle" dominant-baseline="central">this.oPositionContext = binding.create({})</text>
  </g>

  <!-- ── Legende ── -->
  <rect x="30" y="480" width="620" height="120" rx="10" fill="none" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
  <text class="th" x="340" y="504" text-anchor="middle" dominant-baseline="central">Reihenfolge im Controller</text>

  <rect x="50" y="520" width="16" height="16" rx="3" class="c-purple"/>
  <text class="ts" x="74" y="529" dominant-baseline="central">1. Model vorhanden (automatisch via Manifest)</text>

  <rect x="50" y="544" width="16" height="16" rx="3" class="c-teal"/>
  <text class="ts" x="74" y="553" dominant-baseline="central">2. await bindElement + dataReceived → Request Context</text>

  <rect x="50" y="568" width="16" height="16" rx="3" class="c-amber"/>
  <text class="ts" x="74" y="577" dominant-baseline="central">3. await _createOfferContext() → Offer Context aus Request Context</text>

  <rect x="350" y="520" width="16" height="16" rx="3" class="c-blue"/>
  <text class="ts" x="374" y="529" dominant-baseline="central">4. await _createPositionContext() → aus Offer Context</text>

  <rect x="350" y="544" width="16" height="16" rx="3" class="c-coral"/>
  <text class="ts" x="374" y="553" dominant-baseline="central">5. optional: _createParticipantContext() → aus Request Context</text>

  <!-- Dashed Leader Lines für Felder am Offer -->
  <rect x="20" y="248" width="50" height="28" rx="4" fill="none" stroke="var(--color-border-secondary)" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text class="ts" x="45" y="265" text-anchor="middle" dominant-baseline="central" fill="var(--color-text-secondary)">{OfferID}</text>
  <line x1="70" y1="262" x2="80" y2="262" stroke="var(--color-border-secondary)" stroke-width="0.5" stroke-dasharray="3 2"/>

  <!-- Dashed Leader Lines für Felder an Position -->
  <rect x="20" y="378" width="50" height="28" rx="4" fill="none" stroke="var(--color-border-secondary)" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text class="ts" x="45" y="394" text-anchor="middle" dominant-baseline="central" fill="var(--color-text-secondary)">{PosID}</text>
  <line x1="70" y1="392" x2="80" y2="392" stroke="var(--color-border-secondary)" stroke-width="0.5" stroke-dasharray="3 2"/>
</svg>
